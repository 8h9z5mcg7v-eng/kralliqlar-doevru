name: Validate uploaded GLB assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'buildings/**/*.glb'
      - 'buildings/manifest.json'
      - 'scripts/validate-glb.mjs'
      - 'scripts/validate-game-js.mjs'
      - 'index.html'
      - '.github/workflows/validate-glb.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate game JavaScript syntax
        run: node scripts/validate-game-js.mjs
      - name: Validate barracks GLB
        run: node scripts/validate-glb.mjs buildings/barracks/Barracks.glb
