name: Deploy Krallıqlar Dövrü to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate custom medieval stable GLB
        run: |
          python -m pip install --disable-pip-version-check trimesh numpy pillow
          python scripts/create-stable-glb.py
          test -s buildings/stable/Medieval_Horse_Stable.glb
      - name: Download uploaded warehouse GLB
        run: |
          mkdir -p buildings/warehouse
          curl -fL --retry 3 --retry-delay 2 "https://github.com/8h9z5mcg7v-eng/kralliqlar-doevru/releases/download/v1.0.0/medieval_warehouse.glb" -o buildings/warehouse/medieval_warehouse.glb
          test "$(stat -c%s buildings/warehouse/medieval_warehouse.glb)" -gt 50000000
          python scripts/optimize-warehouse-glb.py
          test -s buildings/warehouse/medieval_warehouse.glb
      - name: Download free CC0 medieval tent GLB
        run: |
          mkdir -p buildings/tent
          curl -fL --retry 3 --retry-delay 2 "https://grab3d.com/dl/medieval-tent/medieval-tent.glb" -o buildings/tent/medieval-tent.glb
          python - <<'PY'
          import json,struct,os
          p='buildings/tent/medieval-tent.glb'
          b=open(p,'rb').read()
          if len(b)<100000 or struct.unpack_from('<I',b,0)[0]!=0x46546c67 or struct.unpack_from('<I',b,4)[0]!=2:
              raise SystemExit('Tent GLB missing or invalid')
          off=12; doc=None
          while off+8<=len(b):
              n,t=struct.unpack_from('<II',b,off);off+=8
              if t==0x4E4F534A: doc=json.loads(b[off:off+n])
              off+=n
          if not doc or not doc.get('meshes'): raise SystemExit('Tent GLB has no meshes')
          tris=sum((doc['accessors'][p['indices']]['count']//3 if 'indices' in p else doc['accessors'][p['attributes']['POSITION']]['count']//3) for m in doc['meshes'] for p in m.get('primitives',[]))
          print('TENT_GLB bytes=',len(b),'meshes=',len(doc['meshes']),'triangles=',tris,'images=',len(doc.get('images',[])))
          PY
      - name: Download free field hospital GLB
        run: |
          mkdir -p buildings/hospital
          curl -fL --retry 3 --retry-delay 2 "https://shuriken.studio/models/download/635bf91b-239f-4c31-adc1-6c4671a8cfba" -o buildings/hospital/field-hospital-tent.glb
          python - <<'PY'
          import json,struct,os
          p='buildings/hospital/field-hospital-tent.glb'
          b=open(p,'rb').read()
          if len(b)<100000 or struct.unpack_from('<I',b,0)[0]!=0x46546c67 or struct.unpack_from('<I',b,4)[0]!=2:
              raise SystemExit('Field hospital GLB missing or invalid')
          off=12; doc=None
          while off+8<=len(b):
              n,t=struct.unpack_from('<II',b,off);off+=8
              if t==0x4E4F534A: doc=json.loads(b[off:off+n])
              off+=n
          if not doc or not doc.get('meshes'): raise SystemExit('Field hospital GLB has no meshes')
          tris=sum((doc['accessors'][p['indices']]['count']//3 if 'indices' in p else doc['accessors'][p['attributes']['POSITION']]['count']//3) for m in doc['meshes'] for p in m.get('primitives',[]))
          parts=sum(len(m.get('primitives',[])) for m in doc['meshes'])
          if tris<1000: raise SystemExit('Unexpectedly empty field hospital model')
          print('FIELD_HOSPITAL_GLB bytes=',len(b),'meshes=',len(doc['meshes']),'parts=',parts,'triangles=',tris,'images=',len(doc.get('images',[])))
          PY
      - name: Download and inspect CC0 training yard model
        run: |
          mkdir -p buildings/drill
          curl -fL --retry 3 --retry-delay 2 "https://cdn.3dassets.dev/assets/39227/v1/model.glb" -o /tmp/training-yard-source.glb
          python - <<'PY'
          import json,struct,os
          p='/tmp/training-yard-source.glb'; b=open(p,'rb').read()
          if len(b)<100000 or struct.unpack_from('<I',b,0)[0]!=0x46546c67 or struct.unpack_from('<I',b,4)[0]!=2: raise SystemExit('Training yard GLB missing or invalid')
          off=12; doc=None
          while off+8<=len(b):
            n,t=struct.unpack_from('<II',b,off);off+=8
            if t==0x4E4F534A: doc=json.loads(b[off:off+n])
            off+=n
          if not doc or not doc.get('meshes'): raise SystemExit('Training yard GLB has no meshes')
          print('TRAINING_YARD bytes=',len(b),'meshes=',len(doc.get('meshes',[])),'nodes=',len(doc.get('nodes',[])))
          for i,n in enumerate(doc.get('nodes',[])): print('NODE',i,'name=',n.get('name'),'mesh=',n.get('mesh'))
          for i,m in enumerate(doc.get('meshes',[])): print('MESH',i,'name=',m.get('name'),'primitives=',len(m.get('primitives',[])))
          PY
      - name: Download and prepare CC0 military training yard GLB
        run: |
          mkdir -p buildings/drill
          curl -fL --retry 3 --retry-delay 2 "https://cdn.3dassets.dev/assets/39227/v1/model.glb" -o buildings/drill/training-yard.glb
          python - <<'PY'
          import json,struct,re
          p='buildings/drill/training-yard.glb'; b=open(p,'rb').read()
          if len(b)<100000 or struct.unpack_from('<I',b,0)[0]!=0x46546c67 or struct.unpack_from('<I',b,4)[0]!=2: raise SystemExit('Training yard GLB missing or invalid')
          off=12; doc=None; chunks=[]
          while off+8<=len(b):
            n,t=struct.unpack_from('<II',b,off);off+=8; payload=b[off:off+n];off+=n
            if t==0x4E4F534A: doc=json.loads(payload.decode('utf-8').rstrip(' \\t\\r\\n\\0'))
            chunks.append((t,payload))
          if not doc or not doc.get('meshes'): raise SystemExit('Training yard GLB has no meshes')
          # Remove every human-character group (027–042); retain the yard, dummies, racks and banners.
          pattern=re.compile(r'^(02[7-9]|03[0-9]|04[0-2])-')
          removed=[]
          def prune(parent):
            kept=[]
            for idx in parent.get('children',[]):
              node=doc['nodes'][idx]; name=node.get('name','')
              if pattern.match(name): removed.append(name); continue
              prune(node); kept.append(idx)
            parent['children']=kept
          for root in doc.get('scenes',[{}])[doc.get('scene',0)].get('nodes',[]):
            node=doc['nodes'][root]
            if pattern.match(node.get('name','')): removed.append(node.get('name'))
            else: prune(node)
          # Rebuild the GLB JSON chunk; preserve the binary chunk and all material/texture data.
          raw=json.dumps(doc,separators=(',',':')).encode('utf-8'); raw+=b' '*((4-len(raw)%4)%4)
          out=bytearray(struct.pack('<III',0x46546c67,2,0))
          for t,payload in chunks:
            if t==0x4E4F534A: payload=raw
            out+=struct.pack('<II',len(payload),t)+payload
          struct.pack_into('<I',out,8,len(out))
          open(p,'wb').write(out)
          tris=sum((doc['accessors'][pr['indices']]['count']//3 if 'indices' in pr else doc['accessors'][pr['attributes']['POSITION']]['count']//3) for mesh in doc['meshes'] for pr in mesh.get('primitives',[]))
          print('TRAINING_YARD_READY bytes=',len(out),'meshes=',len(doc['meshes']),'nodes_removed=',len(removed),'triangles_total=',tris,'removed_groups=',','.join(removed))
          if not removed or len(removed)<8: raise SystemExit('Expected character groups were not removed')
          PY
          test -s buildings/drill/training-yard.glb
          python - <<'PY'
          import trimesh
          scene=trimesh.load('buildings/drill/training-yard.glb',force='scene')
          print('TRAINING_YARD_SCENE_BOUNDS=',scene.bounds.tolist())
          print('TRAINING_YARD_SCENE_EXTENTS=',scene.extents.tolist())
          print('TRAINING_YARD_GEOMETRIES=',len(scene.geometry))
          print('TRAINING_YARD_SCENE_NODES=',len(scene.graph.nodes_geometry))
          PY
      - name: Inspect warehouse GLB complexity
        run: |
          python - <<'PY'
          import json,struct
          p='buildings/warehouse/medieval_warehouse.glb'
          b=open(p,'rb').read(); off=12; doc=None
          while off+8<=len(b):
            n,t=struct.unpack_from('<II',b,off); off+=8
            if t==0x4E4F534A: doc=json.loads(b[off:off+n])
            off+=n
          if not doc: raise SystemExit('GLB JSON chunk missing')
          tris=0
          for m in doc.get('meshes',[]):
            for pr in m.get('primitives',[]):
              if 'indices' in pr: tris+=doc['accessors'][pr['indices']]['count']//3
              elif 'POSITION' in pr: tris+=doc['accessors'][pr['attributes']['POSITION']]['count']//3
          print('WAREHOUSE_GLB bytes=',len(b),'meshes=',len(doc.get('meshes',[])),'primitives=',sum(len(m.get('primitives',[])) for m in doc.get('meshes',[])),'triangles=',tris,'images=',len(doc.get('images',[])))
          for i,im in enumerate(doc.get('images',[])):
            if 'bufferView' in im:
              v=doc['bufferViews'][im['bufferView']];print('IMAGE',i,'bytes=',v['byteLength'],'mime=',im.get('mimeType'))
          PY
      - name: Extract troop portraits
        run: |
          mkdir -p images
          unzip -o ordu_portretleri_paketi.zip -d images
          test -f images/piyada.jpg
          test -f images/oxatan.jpg
          test -f images/suvari.jpg
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

