function attack(i){
 const my=power();
 if(!my){lastMsg="Ordun yoxdur! Əvvəlcə əsgər hazırla.";return}
 const ratio=effPower(ETYPE[i])/ePow(i)*(.85+Math.random()*.3),win=ratio>=1;
 const rate=win?.08+Math.random()*.12:.3+Math.random()*.2;
 const up=gainXp(win?15*(i+1):5),upT=up?" 👑 Sərkərdə "+S.hero.lv+". səviyyəyə yüksəldi!":"";
 let lost=0;
 for(const k in S.army){const l=Math.round(S.army[k]*rate);S.army[k]-=l;lost+=l}
 if(win){S.stats.wins++;const m=(i+1)*(1+.2*S.tech.loot+.05*S.hero.sk.loot);S.camps[i]++;const loot={food:Math.round(60*m),wood:Math.round(60*m),stone:Math.round(30*m),gold:Math.round(15*m)};for(const k in loot)S.res[k]+=loot[k];
  lastMsg=`<span class="win">Qələbə!</span> ${E[i][0]} məğlub edildi. Qənimət: ${fmtC(loot)}. İtki: ${lost} əsgər.${upT}`}
 else lastMsg=`<span class="lose">Məğlubiyyət.</span> ${E[i][0]} çox güclü idi. İtki: ${lost} əsgər.${upT}`;
 const ev=Math.random();
 if(win&&ev<.2){const g=20*(i+1)+Math.round(Math.random()*30);S.res.gold+=g;lastMsg+=` 🎁 Düşərgədə sandıq tapdın: +🪙${g}!`}
 else if(ev>.9&&armyN()>0){const x=Math.max(1,Math.round(armyN()*.1));let r=x;for(const k of ["cav","arc","inf"]){const d=Math.min(S.army[k],r);S.army[k]-=d;r-=d}lastMsg+=` 🏹 Pusqu! Əlavə ${x-r} əsgər itirdin.`}
}
