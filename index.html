<div class="tip" id="tip"></div></main>
<script>
let resources={gold:120,wood:80,food:100},year=1,selected='';
const tip=document.getElementById('tip');
function toast(t){tip.textContent=t;tip.classList.add('show');clearTimeout(window.tipTimer);window.tipTimer=setTimeout(()=>tip.classList.remove('show'),1500)}
document.querySelectorAll('[data-tip]').forEach(b=>b.addEventListener('click',()=>toast(b.dataset.tip)));
document.querySelectorAll('[data-build]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-build]').forEach(x=>x.classList.remove('active'));b.classList.add('active');selected=b.dataset.build;toast(b.dataset.tip+' — xəritədə yer seç');}));
document.querySelectorAll('#hotspots [data-building]').forEach(p=>p.addEventListener('click',()=>{if(!selected){toast('Tikinti seç');return}if(resources.gold<25||resources.wood<10){toast('Resurs çatmır');return}resources.gold-=25;resources.wood-=10;document.getElementById('gold').textContent=resources.gold;document.getElementById('wood').textContent=resources.wood;p.setAttribute('fill-opacity','.14');p.setAttribute('stroke-opacity','.9');toast('Tikinti sahəsi seçildi');selected='';document.querySelectorAll('[data-build]').forEach(x=>x.classList.remove('active'));}));
document.getElementById('next').addEventListener('click',()=>{year++;resources.gold+=25;resources.wood+=12;resources.food+=20;for(const k of Object.keys(resources))document.getElementById(k).textContent=resources[k];toast('İl '+year);});
</script></body></html>
