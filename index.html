#res .r{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:0!important;min-width:0!important;width:100%!important;height:25px!important;min-height:25px!important;padding:1px 0!important;overflow:hidden!important;box-sizing:border-box!important}
#res .res-icon{font-size:10px!important;line-height:10px!important}
#res .res-values{display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:center!important;min-width:0!important;max-width:100%!important;line-height:1!important}

}


/* v181: compact live march indicator; hidden when no active expedition */
#march-indicator{display:none;margin-top:4px}
#march-indicator.active{display:block}
.march-live{position:relative;display:flex;align-items:center;gap:7px;min-height:31px;padding:4px 7px 6px;border:1px solid #c18a3e;border-radius:8px;background:linear-gradient(100deg,#382819,#253322);color:#ffe6ad;overflow:hidden;cursor:pointer}
.march-live-icon{flex:0 0 22px;font-size:17px;text-align:center;line-height:1}

/* v182: compact build, research and troop training status row */

function tickRaid(){
 if(Date.now()<S.raidAt)return;
 S.raidAt=Date.now()+(240+Math.random()*180)*1000;
 const rp=Math.round(40*Math.pow(1.15,S.stats.raids));S.stats.raids++;
 const rt=["inf","arc","cav"][Math.floor(Math.random()*3)];
 if(effPower(rt)*(1+.05*S.lv.wall+.08*S.tech.wall)>=rp*(.85+Math.random()*.3)){
  const g=Math.round(rp*.5);S.res.gold+=g;gainXp(10);S.stats.raidWins=(S.stats.raidWins||0)+1;eventState().wins++;
  lastMsg=`<span class="win">Basqın dəf edildi!</span> Quldurlar (${T[rt].n}, güc ${rp}) məğlub oldu. Qənimət: 🪙${g}.`;sfx("win");toast("🛡️ Basqın dəf edildi! +🪙"+g);
 }else{
  const st={};for(const k of ["food","wood","stone","gold"]){const l=Math.floor(S.res[k]*Math.max(.03,.15-.02*S.lv.wall-.01*S.tech.wall));S.res[k]-=l;st[k]=l}
  lastMsg=`<span class="lose">Basqın!</span> Quldurlar (${T[rt].n}, güc ${rp}) şəhəri qarət etdi. İtki: ${fmtC(st)}. Ordunu gücləndir.`;sfx("lose");toast("🏴‍☠️ Quldurlar basqın etdi!");
 }
 addMail("raid",lastMsg.indexOf("dəf edildi")>=0?"Basqın dəf edildi":"Quldur basqını","Quldur gücü "+rp+" · Nəticə: "+(lastMsg.indexOf("dəf edildi")>=0?"müdafiə uğurlu":"resurs itkisi")+".");
 notice=lastMsg;save();render();
}

function worldTerrain(x,y){
 const riverY=23+Math.round(Math.sin(x/5)*2);
 if(Math.abs(y-riverY)<=1)return "water";
 if((x>43&&y<13)||(x<6&&y>42)||(x>43&&y>40))return "mountain";
 if(((x*17+y*31)%13)<4)return "forest";

}

function attack(i){
 const rawPower=power(),heroSkill=heroBattleSkill(S.army);
 if(!rawPower){lastMsg="Ordun yoxdur! Əvvəlcə əsgər hazırla.";return}
 const my=Math.round(rawPower*heroSkill.effect.power),ratio=effPower(ETYPE[i])*heroSkill.effect.power/ePow(i)*(.85+Math.random()*.3),win=ratio>=1;
 const rate=Math.max(.03,(win?.08+Math.random()*.12:.3+Math.random()*.2)-heroSkill.effect.loss);
 const up=gainXp(win?15*(i+1):5),upT=up?" 👑 Sərkərdə "+S.hero.lv+". səviyyəyə yüksəldi!":"";
 let lost=0;const lostBy={inf:0,arc:0,cav:0},hurtBy={inf:0,arc:0,cav:0};
 for(const k of ["inf","arc","cav"]){const l=loseTierTroops(k,Math.round(S.army[k]*rate));lost+=l;lostBy[k]=l;hurtBy[k]=Math.floor(l*.6);S.wounded[k]=(Number(S.wounded[k])||0)+hurtBy[k]}
 if(win){S.stats.wins++;eventState().wins++;const m=(i+1)*(1+.2*S.tech.loot+.05*S.hero.sk.loot)*(heroSkill.effect.loot||1);S.camps[i]++;const loot={food:Math.round(60*m),wood:Math.round(60*m),stone:Math.round(30*m),gold:Math.round(15*m)};for(const k in loot)S.res[k]+=loot[k];
  lastMsg=`<span class="win">Qələbə!</span> ${E[i][0]} məğlub edildi. <b>Qəhrəman bacarığı:</b> ${heroSkill.label}. Qənimət: ${fmtC(loot)}. İtki: ${lost} əsgər (${casualtyDetails(lostBy,hurtBy)}).${upT}`}
 else lastMsg=`<span class="lose">Məğlubiyyət.</span> ${E[i][0]} çox güclü idi. <b>Qəhrəman bacarığı:</b> ${heroSkill.label}. İtki: ${lost} əsgər (${Math.floor(lost*.6)} yaralı, ${lost-Math.floor(lost*.6)} həlak).${upT}`;
 const ev=Math.random();
 if(win&&ev<.2){const g=20*(i+1)+Math.round(Math.random()*30);S.res.gold+=g;lastMsg+=` 🎁 Düşərgədə sandıq tapdın: +🪙${g}!`}
 else if(ev>.9&&armyN()>0){const x=Math.max(1,Math.round(armyN()*.1));let r=x;for(const k of ["cav","arc","inf"]){const d=loseTierTroops(k,r);r-=d;lostBy[k]+=d;hurtBy[k]+=Math.floor(d*.6);S.wounded[k]=(Number(S.wounded[k])||0)+Math.floor(d*.6)}lastMsg+=` 🏹 Pusqu! Əlavə ${x-r} əsgər itirdin, ${Math.floor((x-r)*.6)}-i yaralandı.`}
